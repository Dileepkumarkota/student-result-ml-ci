name: Student Result ML CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-test-deliver:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Train student result model
        run: python train_model.py

      - name: Check ML quality gate
        run: python quality_gate.py

      - name: Run automated ML tests
        run: python -m unittest test_ml_pipeline.py -v

      - name: Run prediction application tests
        run: python -m unittest test_app.py -v

      - name: Upload validated ML artifacts
        uses: actions/upload-artifact@v4
        with:
          name: student-result-ml-artifacts
          path: |
            student_result_model.pkl
            metrics.json
            student_results.csv
          if-no-files-found: error
          retention-days: 7

      - name: Prepare release candidate
        run: |
          mkdir -p release_candidate
          cp app.py release_candidate/
          cp student_result_model.pkl release_candidate/
          cp metrics.json release_candidate/
          cp requirements.txt release_candidate/
          cp Dockerfile release_candidate/
          cp .dockerignore release_candidate/
          printf 'Student Result Prediction ML Application\nRun locally: python app.py\nHealth endpoint: GET /\nPrediction endpoint: POST /predict\nDocker build: docker build -t student-result-ml:1.0 .\nDocker run: docker run --rm -p 5000:5000 student-result-ml:1.0\n' > release_candidate/DEPLOYMENT.txt

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: student-result-ml-release
          path: release_candidate/
          if-no-files-found: error
          retention-days: 7
